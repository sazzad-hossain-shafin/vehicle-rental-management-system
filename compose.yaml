# Local development environment: PostgreSQL + a one-shot schema migration + the API.
#
#   copy .env.example to .env and fill in the secrets (or run scripts/init-env.ps1 or scripts/init-env.sh)
#   docker compose up --build -d
#
# Nothing secret is stored in this file. Values come from .env or the environment; a missing required
# secret stops Compose with a clear message instead of starting something insecure.

name: vehicle-rental

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vehiclerental}
      POSTGRES_USER: ${POSTGRES_USER:-vehiclerental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Local access only (psql, database tools). Not reachable from other machines.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      # Ready means "accepting connections for this database", not just "the process exists".
      test: ["CMD-SHELL", "pg_isready --quiet --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Applies the EF Core migrations, then exits. The API never changes the schema itself; this separate,
  # visible job does, and is safe to run repeatedly (it only applies migrations that are missing).
  migrate:
    build:
      context: .
      target: migrate
    environment:
      # "GSS Encryption Mode=Disable": Kerberos is not used here and not installed in the image, so do not probe for it.
      ConnectionStrings__VehicleRentalDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-vehiclerental};Username=${POSTGRES_USER:-vehiclerental};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};GSS Encryption Mode=Disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      # Development makes the OpenAPI document and the interactive reference available. Set
      # ASPNETCORE_ENVIRONMENT=Production in .env to hide them.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__VehicleRentalDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-vehiclerental};Username=${POSTGRES_USER:-vehiclerental};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};GSS Encryption Mode=Disable"
      # The API refuses to start without a strong signing key; there is deliberately no default.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (at least 32 random characters)}
      Jwt__Issuer: ${JWT_ISSUER:-VehicleRental.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-VehicleRental.Clients}
      # Optional first admin. Leave both empty to create none.
      Seed__Admin__Email: ${ADMIN_EMAIL:-}
      Seed__Admin__Password: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /health is the readiness check: the database must be reachable and migrated. (/health/live only
      # says the process is up.) The official image has no curl, so this talks HTTP with bash itself.
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # Hardening: nothing in the container needs to write to its own filesystem or gain privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  # The customer website: static files served by an unprivileged nginx, which also forwards /api/ to the API so the
  # browser talks to a single origin (this is what makes the HttpOnly session cookie work without CORS).
  # Open http://localhost:8081 (change with WEB_PORT). The API stays reachable on its own port as before.
  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  # The database files. Survives "docker compose down"; deleted only by "docker compose down -v".
  pgdata:

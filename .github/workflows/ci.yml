name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only for every job. Nothing here publishes, pushes or deploys.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Repository hygiene
        run: bash scripts/ci/check-repo-hygiene.sh

      - name: Restore
        run: dotnet restore VehicleRentalManagementSystem.slnx

      - name: Formatting (whitespace only)
        run: dotnet format whitespace VehicleRentalManagementSystem.slnx --verify-no-changes --no-restore

      - name: NuGet vulnerabilities (fail on High/Critical)
        run: python3 scripts/ci/check-vulnerabilities.py

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          # CI-only throwaway credentials for a container that exists for this job alone.
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_throwaway_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Enables the database-backed tests. They create and drop their own uniquely named databases.
      VEHICLERENTAL_TEST_CONNECTION: Host=localhost;Port=5432;Username=ci_user;Password=ci_throwaway_password;GSS Encryption Mode=Disable
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore VehicleRentalManagementSystem.slnx

      - name: Build (Release, warnings are errors)
        run: dotnet build VehicleRentalManagementSystem.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: >-
          dotnet test VehicleRentalManagementSystem.slnx -c Release --no-build
          --logger "trx" --results-directory TestResults

      - name: Verify no test was skipped
        if: success() || failure()
        run: python3 scripts/ci/check-test-results.py TestResults tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Docker build and compose smoke test
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate throwaway environment
        run: |
          bash scripts/init-env.sh
          # Mask the generated values so they can never appear in logs.
          while IFS='=' read -r key value; do
            case "$key" in POSTGRES_PASSWORD|JWT_SIGNING_KEY|ADMIN_PASSWORD)
              [ -n "$value" ] && echo "::add-mask::$value" ;;
            esac
          done < .env

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build API and migration images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for the stack
        run: bash scripts/ci/wait-for-stack.sh 240

      - name: Smoke test
        run: bash scripts/smoke-test.sh

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p compose-diagnostics
          docker compose ps -a > compose-diagnostics/ps.txt 2>&1 || true
          docker compose logs --no-color --tail 300 > compose-diagnostics/logs.txt 2>&1 || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-diagnostics
          path: compose-diagnostics/
          retention-days: 7

      - name: Tear down (containers, networks, volumes)
        if: always()
        run: docker compose down --volumes --remove-orphans

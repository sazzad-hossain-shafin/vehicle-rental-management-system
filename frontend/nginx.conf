# Serves the built website and forwards /api/ to the API container, so the browser only ever talks to one origin.
# That is what lets the HttpOnly session cookie work without any CORS configuration.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The API: same origin, so there is no cross-origin access to allow.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    # Fingerprinted build output never changes under the same name.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.inc;
    }

    # Everything else is the single-page app; unknown paths fall back to index.html, which shows its own "not found".
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.inc;
    }
}
